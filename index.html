<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Donnie’s Newton Fire EMS Dosage Calculator</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 10px; background: #f0f0f0; }
    .container { max-width: 560px; margin: 0 auto; background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    input, select, button { width: 100%; margin: 8px 0; padding: 10px; font-size: 16px; box-sizing: border-box; }
    button { background: #c00; color: white; font-weight: bold; cursor: pointer; }
    #result { white-space: pre-wrap; margin-top: 15px; padding: 12px; background: #f9f9f9; border: 1px solid #ddd; border-radius: 5px; font-size: 15px; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Donnie’s Newton Fire EMS Dosage Calculator</h2>
    
    <input type="number" id="weight" placeholder="Patient weight (lbs)" required>

    <select id="drug" onchange="filterAilments()">
      <option value="">Select Medication</option>
      <option value="Adenosine">Adenosine</option>
      <option value="Amiodarone">Amiodarone</option>
      <option value="Atropine">Atropine</option>
      <option value="Dextrose">Dextrose</option>
      <option value="Diphenhydramine">Diphenhydramine (Benadryl)</option>
      <option value="Epinephrine">Epinephrine (Adrenaline)</option>
      <option value="Fentanyl">Fentanyl</option>
      <option value="Hydralazine">Hydralazine</option>
      <option value="Ketorolac">Ketorolac (Toradol)</option>
      <option value="Ketamine">Ketamine</option>
      <option value="Labetalol">Labetalol</option>
      <option value="Lidocaine">Lidocaine</option>
      <option value="Lorazepam">Lorazepam (Ativan)</option>
      <option value="Magnesium Sulfate">Magnesium Sulfate</option>
      <option value="Midazolam">Midazolam (Versed)</option>
      <option value="Naloxone">Naloxone (Narcan)</option>
      <option value="Ondansetron">Ondansetron</option>
      <option value="Promethazine">Promethazine</option>
      <option value="Sodium Bicarbonate">Sodium Bicarbonate</option>
      <option value="Solu-Medrol">Solu-Medrol</option>
      <option value="Tranexamic Acid">Tranexamic Acid (TXA)</option>
    </select>

    <select id="ailment" onchange="calculateDose()">
      <option value="">Select Ailment</option>
    </select>

    <button onclick="calculateDose()">Calculate Dose</button>
    
    <p id="result"></p>
  </div>

  <script>
    const ailmentMap = {
      "Adenosine": ["SVT / PSVT"],
      "Amiodarone": ["Cardiac Arrest (VF/VT)"],
      "Atropine": ["Bradycardia", "Ketamine Salivation"],
      "Dextrose": ["Hypoglycemia"],
      "Diphenhydramine": ["Anaphylaxis / Allergic Reaction"],
      "Epinephrine": ["Anaphylaxis", "Cardiac Arrest"],
      "Fentanyl": ["Pain Management"],
      "Hydralazine": ["Hypertensive Emergency"],
      "Ketorolac": ["Pain Management"],
      "Ketamine": ["Pain", "Sedation (Agitated/HDSA)", "RSI Induction"],
      "Labetalol": ["Hypertensive Emergency"],
      "Lidocaine": ["Refractory VF/VT"],
      "Lorazepam": ["Seizure", "Sedation"],
      "Magnesium Sulfate": ["Torsades / Polymorphic VT", "Eclampsia", "Severe Asthma"],
      "Midazolam": ["Seizure", "Sedation"],
      "Naloxone": ["Opioid Overdose"],
      "Ondansetron": ["Nausea / Vomiting"],
      "Promethazine": ["Nausea / Vomiting"],
      "Sodium Bicarbonate": ["TCA Overdose (QRS Widening)"],
      "Solu-Medrol": ["Anaphylaxis / Allergic Reaction"],
      "Tranexamic Acid": ["Trauma Hemorrhage"]
    };

    function filterAilments() {
      const drug = document.getElementById("drug").value;
      const ailmentSelect = document.getElementById("ailment");
      ailmentSelect.innerHTML = "<option value=''>Select Ailment</option>";
      if (drug && ailmentMap[drug]) {
        ailmentMap[drug].forEach(a => {
          let opt = document.createElement("option");
          opt.value = a;
          opt.textContent = a;
          ailmentSelect.appendChild(opt);
        });
      }
    }

    function calculateDose() {
      const weightLbs = parseFloat(document.getElementById("weight").value);
      if (!weightLbs) {
        document.getElementById("result").innerHTML = "<strong>Enter patient weight in lbs</strong>";
        return;
      }
      const kg = Math.round(weightLbs / 2.2);
      const drug = document.getElementById("drug").value;
      const ailment = document.getElementById("ailment").value;

      if (!drug || !ailment) {
        document.getElementById("result").innerHTML = "<strong>Select medication and ailment</strong>";
        return;
      }

      let output = `Patient Weight: ${weightLbs} lbs (${kg} kg)\n\n<b>${drug} – ${ailment}</b>\n\n`;

      if (drug === "Adenosine" && ailment === "SVT / PSVT") {
        output += `<b>SOG Dose:</b> 6 mg rapid IV bolus, repeat 12 mg after 1-2 minutes if needed (SOG 32-70)\n`;
        output += `<b>Calculated Dose:</b> 6 mg then 12 mg (protocol maximum)\n`;
        output += `<b>Requirements:</b> Rapid IV push followed immediately by 20 mL saline flush. Use for stable SVT/PSVT only.\n`;
        output += `<b>Contraindications:</b> Unstable SVT (cardiovert instead), WPW, 2nd/3rd degree AV block without pacemaker\n\n`;
      } 
      else if (drug === "Amiodarone" && ailment === "Cardiac Arrest (VF/VT)") {
        output += `<b>SOG Dose:</b> 300 mg IV/IO, repeat 150 mg in 3-5 minutes if refractory (SOG 32-67)\n`;
        output += `<b>Calculated Dose:</b> 300 mg IV/IO (repeat 150 mg once)\n`;
        output += `<b>Requirements:</b> For refractory VF/VT during arrest. Start 1 mg/min maintenance infusion after conversion.\n`;
        output += `<b>Contraindications:</b> None listed in arrest protocol\n\n`;
      } 
      else if (drug === "Atropine" && ailment === "Bradycardia") {
        output += `<b>SOG Dose:</b> 1 mg IV/IO fast push, repeat every 3-5 minutes to max 3 mg (SOG 32-40)\n`;
        output += `<b>Calculated Dose:</b> 1 mg (repeat to max 3 mg)\n`;
        output += `<b>Requirements:</b> Give after oxygenation, ventilation, and fluid volume have been addressed.\n`;
        output += `<b>Contraindications:</b> None for symptomatic bradycardia\n\n`;
      } 
      else if (drug === "Atropine" && ailment === "Ketamine Salivation") {
        output += `<b>SOG Dose:</b> 0.5 mg IV/IO fast push (SOG 32-12)\n`;
        output += `<b>Calculated Dose:</b> 0.5 mg\n`;
        output += `<b>Requirements:</b> Use only for severe salivation compromising airway after Ketamine.\n`;
        output += `<b>Contraindications:</b> None listed for this use\n\n`;
      } 
      else if (drug === "Dextrose" && ailment === "Hypoglycemia") {
        output += `<b>SOG Dose:</b> D50% up to 25 g IV/IO titrate to effect (peds 0.5–1 g/kg D25W/D10%) — SOG 32-115\n`;
        output += `<b>Calculated Dose:</b> Up to 25 g adult (titrate to effect)\n`;
        output += `<b>Requirements:</b> Blood glucose <60 mg/dL with symptoms.\n`;
        output += `<b>Contraindications:</b> None listed\n\n`;
      } 
      else if (drug === "Diphenhydramine" && ailment === "Anaphylaxis / Allergic Reaction") {
        output += `<b>SOG Dose:</b> 25-50 mg IV/IO slow push or IM (SOG 32-110)\n`;
        output += `<b>Calculated Range:</b> 25 – 50 mg (protocol maximum)\n`;
        output += `<b>Requirements:</b> Slow push for IV/IO or give IM if no IV access.\n`;
        output += `<b>Contraindications:</b> None listed in anaphylaxis protocol\n\n`;
      } 
      else if (drug === "Epinephrine" && ailment === "Anaphylaxis") {
        output += `<b>SOG Dose:</b> 0.3 mg (1:1,000) IM adult (peds 0.01 mg/kg, max adult dose) — SOG 32-110\n`;
        output += `<b>Calculated IM Dose:</b> 0.3 mg (protocol maximum)\n`;
        output += `<b>Requirements:</b> Preferred IM route using 1:1,000 concentration.\n`;
        output += `<b>Contraindications:</b> Recent PDE-5 inhibitor use (Viagra/sildenafil within 24 hrs, Cialis within 48 hrs)\n\n`;
      } 
      else if (drug === "Epinephrine" && ailment === "Cardiac Arrest") {
        output += `<b>SOG Dose:</b> 1 mg (1:10,000) IV/IO every 3-5 minutes (max 5 doses) — SOG 32-67\n`;
        output += `<b>Calculated Dose:</b> 1 mg IV/IO (repeat every 3-5 minutes)\n`;
        output += `<b>Requirements:</b> Use during high-quality CPR for asystole/PEA/VF/VT.\n`;
        output += `<b>Contraindications:</b> None in arrest protocol\n\n`;
      } 
      else if (drug === "Fentanyl" && ailment === "Pain Management") {
        output += `<b>SOG Dose:</b> 0.1 – 2 mcg/kg IV/IO/IM/IN (SOG 32-18)\n`;
        let minD = Math.max(10, Math.round(0.1 * kg));
        let maxD = Math.min(200, Math.round(2 * kg));
        output += `<b>Calculated Range:</b> ${minD} – ${maxD} mcg (protocol maximum)\n`;
        output += `<b>Requirements:</b> Titrate to effect, maintain SBP > 90 mmHg\n`;
        output += `<b>Contraindications:</b> None listed if SBP maintained\n\n`;
      } 
      else if (drug === "Hydralazine" && ailment === "Hypertensive Emergency") {
        output += `<b>SOG Dose:</b> 10 mg IV/IO, may repeat x1 after 5 minutes (SOG 32-55)\n`;
        output += `<b>Calculated Dose:</b> 10 mg IV/IO (repeat once if needed)\n`;
        output += `<b>Requirements:</b> SBP >180 and/or DBP >110 + symptoms (severe headache, AMS, pulmonary edema, TIA). Target SBP <160 or DBP <100. Contact med control if CVA suspected.\n`;
        output += `<b>Contraindications:</b> Use caution if CVA suspected.\n\n`;
      } 
      else if (drug === "Ketorolac" && ailment === "Pain Management") {
        output += `<b>SOG Dose:</b> Adult <65 yrs: 15-30 mg IV/IM; ≥65 yrs: 15 mg IV/IM (no repeat) — SOG 32-18\n`;
        output += `<b>Calculated Dose:</b> 15 mg (standard starting dose)\n`;
        output += `<b>Requirements:</b> No repeat dose.\n`;
        output += `<b>Contraindications:</b> Chronic kidney disease, peptic ulcer, recent GI bleed, pregnancy, suspected stroke/ICH\n\n`;
      } 
      else if (drug === "Ketamine" && ailment === "Pain") {
        output += `<b>SOG Dose:</b> 0.1 – 0.3 mg/kg IV/IO/IN (SOG 32-18)\n`;
        let minD = Math.round(0.1 * kg);
        let maxD = Math.round(0.3 * kg);
        output += `<b>Calculated Range:</b> ${minD} – ${maxD} mg (protocol maximum)\n`;
        output += `<b>Requirements:</b> May be used alone or with Fentanyl/Ketorolac. Repeat x1 if needed.\n`;
        output += `<b>Contraindications:</b> None listed for analgesia dose\n\n`;
      } 
      else if (drug === "Ketamine" && ailment === "Sedation (Agitated/HDSA)") {
        let dose = Math.min(500, Math.round(4 * kg));
        output += `<b>SOG Dose:</b> 4 mg/kg IM (max 500 mg) — SOG 32-12\n`;
        output += `<b>Calculated IM Dose:</b> ${dose} mg (protocol maximum)\n`;
        output += `<b>Requirements:</b> Follow with Midazolam IV/IO if needed for continued sedation.\n`;
        output += `<b>Contraindications:</b> None listed\n\n`;
      } 
      else if (drug === "Ketamine" && ailment === "RSI Induction") {
        output += `<b>SOG Dose:</b> 1 – 2 mg/kg IV/IO/IN (SOG 32-15)\n`;
        let minD = Math.round(1 * kg);
        let maxD = Math.round(2 * kg);
        output += `<b>Calculated Range:</b> ${minD} – ${maxD} mg (protocol maximum)\n`;
        output += `<b>Requirements:</b> Induction dose for medication facilitated airway.\n`;
        output += `<b>Contraindications:</b> None listed\n\n`;
      } 
      else if (drug === "Labetalol" && ailment === "Hypertensive Emergency") {
        output += `<b>SOG Dose:</b> 10 mg IV slow push over 2 min, may repeat x1 after 15 min (SOG 32-55)\n`;
        output += `<b>Calculated Dose:</b> 10 mg IV (repeat once if needed)\n`;
        output += `<b>Requirements:</b> Use if Hydralazine not effective.\n`;
        output += `<b>Contraindications:</b> Avoid in acute coronary syndrome\n\n`;
      } 
      else if (drug === "Lidocaine" && ailment === "Refractory VF/VT") {
        output += `<b>SOG Dose:</b> 1 mg/kg IV/IO (repeat 0.5 mg/kg) max 3 mg/kg — SOG 32-67\n`;
        let minD = Math.round(1 * kg);
        let maxD = Math.round(3 * kg);
        output += `<b>Calculated Range:</b> ${minD} – ${maxD} mg (protocol maximum)\n`;
        output += `<b>Requirements:</b> For refractory VF/VT or conscious IO insertion (20-40 mg slow push).\n`;
        output += `<b>Contraindications:</b> 2nd/3rd degree AV block without pacemaker\n\n`;
      } 
      else if (drug === "Lorazepam" && (ailment === "Seizure" || ailment === "Sedation")) {
        output += `<b>SOG Dose:</b> 1 – 4 mg IV/IO/IM titrated to effect (max 4 mg) — SOG 32-16\n`;
        output += `<b>Calculated Range:</b> 1 – 4 mg (protocol maximum)\n`;
        output += `<b>Requirements:</b> Dilute IV/IO with equal volume isotonic.\n`;
        output += `<b>Contraindications:</b> None listed for seizure/sedation\n\n`;
      } 
      else if (drug === "Magnesium Sulfate" && ailment === "Torsades / Polymorphic VT") {
        output += `<b>SOG Dose:</b> 2 g IV/IO over 1-2 minutes, repeat once in 5-10 minutes (SOG 32-67)\n`;
        output += `<b>Calculated Dose:</b> 2 g\n`;
        output += `<b>Requirements:</b> Torsades or polymorphic VT.\n`;
        output += `<b>Contraindications:</b> Renal failure\n\n`;
      } 
      else if (drug === "Magnesium Sulfate" && ailment === "Eclampsia") {
        output += `<b>SOG Dose:</b> 4 g IV/IO over 10 minutes (SOG 32-55)\n`;
        output += `<b>Calculated Dose:</b> 4 g\n`;
        output += `<b>Requirements:</b> Eclampsia/seizures.\n`;
        output += `<b>Contraindications:</b> Renal failure\n\n`;
      } 
      else if (drug === "Magnesium Sulfate" && ailment === "Severe Asthma") {
        output += `<b>SOG Dose:</b> 1 g IV/IO over 10 minutes (SOG 32-110)\n`;
        output += `<b>Calculated Dose:</b> 1 g\n`;
        output += `<b>Requirements:</b> Severe refractory asthma.\n`;
        output += `<b>Contraindications:</b> Renal failure\n\n`;
      } 
      else if (drug === "Midazolam" && (ailment === "Seizure" || ailment === "Sedation")) {
        output += `<b>SOG Dose:</b> 2 – 5 mg IV/IO titrated OR 5 – 10 mg IM/IN (SOG 32-16)\n`;
        output += `<b>Calculated Range:</b> 2 – 5 mg IV/IO (or 5 – 10 mg IM/IN) (protocol maximum)\n`;
        output += `<b>Requirements:</b> Titrate to effect. Maintain SBP >90 mmHg unless active seizure.\n`;
        output += `<b>Contraindications:</b> None listed for seizure/sedation\n\n`;
      } 
      else if (drug === "Naloxone" && ailment === "Opioid Overdose") {
        output += `<b>SOG Dose:</b> 0.1 – 2 mg IV/IO/IN titrated to respiratory drive (SOG 32-18)\n`;
        output += `<b>Calculated Range:</b> 0.1 – 2 mg (protocol maximum)\n`;
        output += `<b>Requirements:</b> Titrate to adequate respiratory drive, repeat PRN.\n`;
        output += `<b>Contraindications:</b> None listed\n\n`;
      } 
      else if (drug === "Ondansetron" && ailment === "Nausea / Vomiting") {
        output += `<b>SOG Dose:</b> 4 mg IV/IO/IM (SOG 32-17)\n`;
        output += `<b>Calculated Dose:</b> 4 mg\n`;
        output += `<b>Requirements:</b> Slow push for IV.\n`;
        output += `<b>Contraindications:</b> Hypersensitivity\n\n`;
      } 
      else if (drug === "Promethazine" && ailment === "Nausea / Vomiting") {
        output += `<b>SOG Dose:</b> 12.5 mg IV slow push or IM (SOG 32-17)\n`;
        output += `<b>Calculated Dose:</b> 12.5 mg\n`;
        output += `<b>Requirements:</b> Slow push.\n`;
        output += `<b>Contraindications:</b> Severe respiratory depression\n\n`;
      } 
      else if (drug === "Sodium Bicarbonate" && ailment === "TCA Overdose (QRS Widening)") {
        output += `<b>SOG Dose:</b> 1 – 2 mEq/kg IV/IO slow push over 2 minutes (SOG 32-96)\n`;
        let minD = Math.round(1 * kg);
        let maxD = Math.round(2 * kg);
        output += `<b>Calculated Range:</b> ${minD} – ${maxD} mEq (protocol maximum)\n`;
        output += `<b>Requirements:</b> QRS >120 ms in TCA overdose.\n`;
        output += `<b>Contraindications:</b> Alkalosis, hypocalcemia\n\n`;
      } 
      else if (drug === "Solu-Medrol" && ailment === "Anaphylaxis / Allergic Reaction") {
        output += `<b>SOG Dose:</b> 125 mg IV/IO/IM adult (2 mg/kg peds) — SOG 32-110\n`;
        output += `<b>Calculated Dose:</b> 125 mg\n`;
        output += `<b>Requirements:</b> For anaphylaxis or severe allergic reaction.\n`;
        output += `<b>Contraindications:</b> Hypersensitivity\n\n`;
      } 
      else if (drug === "Tranexamic Acid" && ailment === "Trauma Hemorrhage") {
        output += `<b>SOG Dose:</b> 2 g IV/IO slow push (15 mg/kg peds, max 1 g)\n`;
        output += `<b>Calculated Dose:</b> 2 g\n`;
        output += `<b>Requirements:</b> Slow push for significant hemorrhage.\n`;
        output += `<b>Contraindications:</b> Hypersensitivity\n\n`;
      }

      output += `\nAlways double-check with current SOG + your partner.`;
      document.getElementById("result").innerHTML = output;
    }
  </script>
</body>
</html>
